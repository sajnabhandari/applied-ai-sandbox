<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sandbox Notes</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.25rem; }
    .meta { color: #666; margin-bottom: 1.5rem; }
    .note { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
    .note h3 { margin: 0 0 0.5rem; }
    a.btn { display: inline-block; background: #1a2540; color: #fff; padding: 0.5rem 1rem; border-radius: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <h1>Sandbox Notes</h1>
  <p class="meta">A tiny note-taking app. Practice ground for the Applied AI cohort.</p>

  <a class="btn" href="{{ url_for('new_note') }}">+ New note</a>

  <form method="GET" action="{{ url_for('home') }}" style="margin-top: 1rem;">
    <input name="q" type="search" placeholder="Search notes…" value="{{ q or '' }}"
           style="padding: 0.4rem 0.75rem; border: 1px solid #ccc; border-radius: 6px; font: inherit; width: 60%;">
    <button type="submit" style="padding: 0.4rem 0.75rem; margin-left: 0.25rem; border-radius: 6px; border: 1px solid #ccc; cursor: pointer;">Search</button>
    {% if q %}<a href="{{ url_for('home') }}" style="margin-left: 0.5rem; color: #666;">✕ Clear</a>{% endif %}
  </form>

  <h2 style="margin-top: 1.25rem;">Your notes ({{ notes|length }})</h2>
  {% if notes %}
    {% for note in notes %}
      <div class="note">
        <h3>{{ note.title }}</h3>
        <p>{{ note.body }}</p>
      </div>
    {% endfor %}
  {% else %}
    <p>No notes yet.</p>
  {% endif %}
</body>
</html>
